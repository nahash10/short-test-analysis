<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<title>نتائج الاختبار القصير</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  color-scheme:light;
  --paper:#f3f7fa; --surface:#ffffff; --raise:#ffffff; --mist:#e7eff4; --line:#d6e1e9;
  --ink:#0f2a4a; --ink2:#46596e; --muted:#7a8a9b;
  --brand:#0f2a4a; --teal:#17808f; --teal-soft:#dff0f2;
  --gold:#a87b1f; --gold-soft:#f6edd8; --crit:#c0392b; --weak:#e0806b; --weak-soft:#fbe8e3;
  --bA:#1c5cab; --bB:#6da7ec; --bC:#bdbab1; --bD:#ee9b8c; --bE:#c0392b;
  --s10:#2a78d6; --s11:#e3622d; --s12:#12936a; --cell-empty:#e3ebf1;
  --shadow:0 1px 0 rgba(15,42,74,.06),0 6px 18px -10px rgba(15,42,74,.25);
  --bar-h:64px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0b1520; --surface:#122030; --raise:#172a3d; --mist:#1b2e42; --line:#25394e;
    --ink:#e8eff6; --ink2:#a9bacb; --muted:#7f93a7;
    --brand:#9cc7f0; --teal:#3fb6c5; --teal-soft:#123a40;
    --gold:#e2b552; --gold-soft:#3a2f17; --crit:#ec6a5c; --weak:#ef9a86; --weak-soft:#3b2421;
    --bA:#4d8fe0; --bB:#8fbdf2; --bC:#7d7a72; --bD:#e8907f; --bE:#e0574a;
    --s10:#4d93e6; --s11:#ef7a48; --s12:#2bb385; --cell-empty:#22374b;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0b1520; --surface:#122030; --raise:#172a3d; --mist:#1b2e42; --line:#25394e;
  --ink:#e8eff6; --ink2:#a9bacb; --muted:#7f93a7;
  --brand:#9cc7f0; --teal:#3fb6c5; --teal-soft:#123a40;
  --gold:#e2b552; --gold-soft:#3a2f17; --crit:#ec6a5c; --weak:#ef9a86; --weak-soft:#3b2421;
  --bA:#4d8fe0; --bB:#8fbdf2; --bC:#7d7a72; --bD:#e8907f; --bE:#e0574a;
  --s10:#4d93e6; --s11:#ef7a48; --s12:#2bb385; --cell-empty:#22374b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:15.5px;line-height:1.75;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;display:inline-block}
h1,h2,h3{font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;line-height:1.45}
/* ---------- إطار التطبيق ---------- */
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom) + 18px)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:0 0 40px}
.iconbtn:active{background:var(--mist)}
.iconbtn[hidden]{display:none}
.iconbtn svg{width:22px;height:22px}
.view{padding:6px 16px 10px}
.view.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.enter{animation:none}.cell i{transition:none!important}}
/* شريط التبويب السفلي */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--bar-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tabbar a svg{width:23px;height:23px}
.tabbar a.on{color:var(--teal);font-weight:700}
/* ---------- مسطرة الخمس عشرة (العنصر المميز) ---------- */
.ruler{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;direction:rtl}
.cell{height:var(--ch,14px);border-radius:3px;background:var(--cell-empty);position:relative;overflow:hidden}
.cell i{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--fill,var(--teal));transition:width .5s cubic-bezier(.3,.7,.3,1)}
.ruler.big{--ch:44px;gap:4px}.ruler.big .cell{border-radius:6px}
.ruler.mid{--ch:20px}
.ruler.sm{--ch:9px;gap:2px}.ruler.sm .cell{border-radius:2px}
.ruler-scale{display:flex;justify-content:space-between;direction:rtl;font-size:11.5px;color:var(--muted);margin-top:4px}
/* ---------- الرئيسة ---------- */
.hero{text-align:center;padding:8px 0 4px}
.hero img{width:min(240px,64vw);filter:drop-shadow(0 2px 0 rgba(255,255,255,.4))}
:root[data-theme="dark"] .hero img{filter:brightness(1.6) saturate(.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero img{filter:brightness(1.6) saturate(.9)}}
.hero .dept{color:var(--teal);font-weight:600;font-size:14px;margin-top:2px}
.hero h2{font-size:26px;font-weight:800;margin-top:2px;color:var(--brand)}
.hero .term{color:var(--muted);font-size:13px}
.scorecard{background:var(--surface);border-radius:20px;padding:18px 16px 16px;margin-top:16px;box-shadow:var(--shadow)}
.score-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.score-head .big{font-family:'Noto Kufi Arabic';font-size:40px;font-weight:800;line-height:1;color:var(--ink)}
.score-head .big small{font-size:16px;color:var(--muted);font-weight:600;margin-right:4px}
.score-head .cap{font-size:13.5px;color:var(--ink2);text-align:left;line-height:1.5}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;text-align:center}
.facts b{display:block;font-size:19px;font-weight:700;line-height:1.3}
.facts span{font-size:12px;color:var(--muted)}
.facts .w b{color:var(--crit)} .facts .g b{color:var(--gold)}
.sec-title{font-size:15px;font-weight:700;color:var(--ink2);margin:22px 2px 10px;font-family:'Noto Kufi Arabic'}
.stagebtns{display:flex;flex-direction:column;gap:10px}
.stagebtn{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border-inline-start:5px solid var(--sc)}
.stagebtn h3{font-size:16px;font-weight:700}
.stagebtn .m{font-size:22px;font-weight:700;color:var(--sc)}
.stagebtn .ruler{grid-column:1/-1}
.stagebtn .meta{grid-column:1/-1;display:flex;gap:14px;font-size:12.5px;color:var(--ink2)}
.stagebtn:active,.tile:active,.crow:active{transform:scale(.985)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)}
.tile .ic svg{width:21px;height:21px}
.tile h3{font-size:14.5px;font-weight:700;line-height:1.4;margin-top:auto}
.tile p{font-size:12.5px;color:var(--muted);line-height:1.4}
.tile.weak .ic{background:var(--weak-soft);color:var(--crit)} .tile.gold .ic{background:var(--gold-soft);color:var(--gold)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:12px}
.tile.wide h3{margin:0}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:26px 0 6px;line-height:1.7}
/* ---------- صفحات ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--mist);border-radius:14px;padding:4px;gap:4px;margin:4px 0 14px}
.seg a,.seg button{text-align:center;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:-4px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--mist);border-radius:12px;padding:9px 6px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:700;line-height:1.35}
.stat span{font-size:11.5px;color:var(--ink2)}
.stat.w b{color:var(--crit)} .stat.g b{color:var(--gold)}
.pagehead{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.pagehead .badge{font-family:'Noto Kufi Arabic';font-weight:800;font-size:22px;background:var(--sc,var(--teal));color:#fff;border-radius:14px;padding:6px 14px;line-height:1.5}
.pagehead .t{flex:1}.pagehead .t b{display:block;font-size:17px}.pagehead .t span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:260px;direction:ltr}
.insight{list-style:none;display:flex;flex-direction:column;gap:9px}
.insight li{position:relative;padding-inline-start:16px;font-size:14.5px}
.insight li::before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:7px;height:7px;border-radius:2px;background:var(--teal)}
.crow{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:6px 12px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.crow .lb{font-family:'Noto Kufi Arabic';font-weight:800;font-size:17px;color:var(--sc)}
.crow .mv{font-weight:700;font-size:17px}
.crow .chips{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:20px;background:var(--mist);color:var(--ink2)}
.chip.w{background:var(--weak-soft);color:var(--crit)} .chip.g{background:var(--gold-soft);color:var(--gold)} .chip.up{background:var(--teal-soft);color:var(--teal)}
.navpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.navpair a{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.navpair a:last-child{justify-content:flex-end}
.navpair a.off{visibility:hidden}
.note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.bandbar{display:flex;height:30px;border-radius:9px;overflow:hidden;gap:2px;direction:ltr}
.bandbar span{display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;min-width:0}
.bandbar span.lt{color:#1d2b3a}
.steps{list-style:none;position:relative}
.steps li{position:relative;padding:0 30px 16px 0}
.steps li::before{content:"";position:absolute;right:9px;top:8px;bottom:-4px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li::after{content:"";position:absolute;right:3px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--teal)}
.steps b{display:block;font-size:15px}
.steps .when{font-size:12px;color:var(--teal);font-weight:600}
.steps p{font-size:14px;color:var(--ink2)}
details.acc{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
details.acc summary{list-style:none;padding:13px 16px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"";width:9px;height:9px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:0 0 9px}
details.acc[open] summary::after{transform:rotate(135deg)}
details.acc .body{padding:0 16px 14px;font-size:14px;color:var(--ink2)}
details.acc .body b{color:var(--ink)}
.dosage{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:10px 0 6px}
.dosage i{height:22px;border-radius:4px}
.select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cmp-row:last-child{border:0}
.cmp-row .k{font-size:12.5px;color:var(--muted);text-align:center}
.cmp-row .a{text-align:right;font-weight:700}.cmp-row .b{text-align:left;font-weight:700}
.cmp-row .win{color:var(--teal)}
.rec{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}
.rec .n{flex:0 0 30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal);font-weight:700;display:grid;place-items:center}
.rec b{display:block;font-size:14.5px}.rec p{font-size:13.5px;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-weight:600;color:var(--muted);font-size:12px;text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.t td:first-child,table.t th:first-child{text-align:right}
table.t tr:last-child td{border:0}
.more-list a{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:8px;font-weight:600}
.more-list a .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)}
.more-list a .ic svg{width:19px;height:19px}
.more-list a span.d{display:block;font-size:12px;color:var(--muted);font-weight:400}
.more-list a .chev{margin-inline-start:auto;color:var(--muted)}
.theme-row{display:flex;justify-content:space-between;align-items:center}
/* الحاسوب */
@media (min-width:900px){
  body{background:radial-gradient(1200px 600px at 50% -200px,var(--teal-soft),transparent),var(--paper)}
  .app{max-width:760px}
  .tabbar nav{max-width:760px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .stagebtns{display:grid;grid-template-columns:repeat(3,1fr)}
  .chart{height:300px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <button class="iconbtn" id="back" aria-label="رجوع" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <h1 id="title">نتائج الاختبار القصير</h1>
    <button class="iconbtn" id="themebtn" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
</div>
<div class="tabbar"><nav id="tabs">
  <a href="#/" data-k="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>الرئيسة</a>
  <a href="#/stage/10" data-k="stage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>المراحل</a>
  <a href="#/weak" data-k="weak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>الضعاف</a>
  <a href="#/gifted" data-k="gifted"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>الفائقون</a>
  <a href="#/more" data-k="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>المزيد</a>

const T={"spec": [["الفهم والاستيعاب", 4, 2, 6, "العاشر: 4 للبناء الفكري، 1 للبناء اللغوي، 1 لجماليات النص"], ["الثروة اللغوية (المعجم والدلالة في العاشر)", 1, 1, 2, ""], ["فنون البلاغة", 2, 1, 3, ""], ["قواعد النحو والصرف", 2, 2, 4, ""]], "remedial": [["توزيع العلاج على المجالات", "لأن الدرجات رُصدت مجموعًا لا مجالات، يُعدّ ضعف المتعلم موزّعًا على المجالات الأربعة بنسبة أوزانها في الاختبار؛ فتُقسم الوقفات العلاجية الاثنتا عشرة (3 في الأسبوع × 4 أسابيع): الفهم والاستيعاب 5 · النحو 3 · البلاغة 2 · الثروة اللغوية 2. ومن يرصد له معلمه درجات المجالات يُخصَّص علاجه بحسبها.", "الأسبوع التاسع"], ["الوقفة العلاجية", "سؤالٌ واحد يُفتتح به الدرس ويُشرح في دقائق، يقصد مهارةً ثبت ضعف المتعلمين فيها؛ ثلاث وقفات في الأسبوع على الأقل، وتُعاد المهارة على فترات متباعدة (أسبوعان إلى ثلاثة) ليثبت أثرها.", "الأسابيع 9 – 12"], ["تعلُّم الأقران", "يُقرَن كل متعلم ضعيف بزميل متفوق من شعبته («سفير الضاد») في نشاط ثنائي قصير داخل الحصة، فيستفيد الطرفان: الضعيف بالشرح القريب، والمتفوق بتعميق فهمه.", "مستمر"], ["أوراق عمل متدرجة", "ورقة لكل مجال بثلاثة مستويات (تذكّر ← فهم ← تطبيق)، يبدأ منها المتعلم بحسب درجته (الحرِج من التذكّر، ودون المستوى من الفهم)، وتُصحَّح بتغذية راجعة مكتوبة قصيرة.", "أسبوعيًّا"], ["الشراكة مع الأسرة", "تواصلٌ مع وليّ أمر كل متعلم في الفئة الحرجة (دون نصف الدرجة) لإطلاعه على الخطة، وإحالة من يُشتبه في أن سبب ضعفه غير معرفي (غياب، انصراف، ظرف خاص) إلى الأخصائي الاجتماعي.", "الأسبوع التاسع"], ["إعادة القياس", "اختبارٌ تتبُّعي قصير بالمواصفات نفسها (15 درجة) يطبّقه كل معلم على متعلمي الخطة، ويُقارن بنتيجة القصير لقياس أثر العلاج قبل الامتحان النهائي.", "الأسبوع الثاني عشر"]], "remedial_stage": {"10": [["الفهم — البناء الفكري", "استخلاص الفكرة الرئيسة والأفكار الجزئية، والربط بين الحدث وسببه ونتيجته في قصة موسى عليه السلام", "خريطة أحداث للآيات 1 – 13، ثم بطاقات «ما الفكرة؟» على مقاطع من ثلاث آيات"], ["الفهم — البناء اللغوي والجماليات", "دلالة اللفظ والتركيب، وأثر الصورة في المعنى", "سؤال «لماذا اختار النص هذه الكلمة؟» مع بديلين، ونموذج إجابة من سطر واحد"], ["المعجم والدلالة", "المترادف من «أضف إلى معجمك»، والمعنى السياقي، والتصريف والجمع", "بطاقات مفردات مصوّرة، ولعبة «الكلمة في جملتين» لتمييز المعنى السياقي"], ["فنون البلاغة", "أركان التشبيه (المشبه، المشبه به، الأداة، وجه الشبه) وأقسامه", "جدول تفكيك التشبيه بأربع خانات، ثم تحويل تشبيه تام إلى بليغ والعكس"], ["قواعد النحو", "عمل كان وأخواتها، وإعراب اسمها وخبرها، وصور الخبر", "إعراب موجَّه بالألوان (الاسم بلون والخبر بلون)، وتدريب الإدخال: «أدخل (أصبح) على الجملة…»"]], "11": [["الفهم والاستيعاب", "القيم في حديث النفر الثلاثة (الشكر والجحود)، ودلالات الألفاظ وفق جدول الخطة (الجملة الاسمية، النكرة، الماضي، المضارع)", "جدول «اللفظ ← دلالته» مع مثال من الحديث، وتمييز القيمة الضمنية من الصريحة"], ["الثروة اللغوية", "معجم الخطة: المترادف، والمفرد والجمع، وتصريف «حسن»، ومعاني «بعث» السياقية", "بطاقات معجم الخطة وحدها (لا يُسأل عن غيرها)، وجمل توظيف قصيرة"], ["فنون البلاغة", "التمييز بين الخبر والإنشاء، والصورة التركيبية لجملة الخبر (المسند، المسند إليه، القيود)", "فرز عشر جمل في عمودين، ثم «حوّل الخبر إلى إنشاء» بنمطين"], ["قواعد النحو", "المفعول فيه: ظرف الزمان والمكان، والمعرب والمبني، وإعرابه", "استخراج الظروف من نص الحديث، وجدول «ظرف معرب / ظرف مبني» بعلامته"]], "12": [["الفهم والاستيعاب", "دلالات الألفاظ في آيات الروم، والمقابلة وأثرها، وفائدة تكرار «ومن آياته»", "قراءة موجَّهة بثلاثة أسئلة لكل مقطع، والرجوع إلى التحرير والتنوير عند الخلاف"], ["الثروة اللغوية", "معجم الخطة: يُحبَرون، ألسنتكم، آيات، ابتغاؤكم… ومعاني «ظهر» السياقية", "مزاوجة بين الكلمة ومرادفها في سياقها، وجمل توظيف"], ["فنون البلاغة", "الصورة التركيبية لجملة الخبر: تعيين المسند والمسند إليه والقيود، وأثر المحسن البديعي", "تفكيك جملة بالأسهم (ركن ← قيد)، ونماذج من بلاغة 11 ص18 – 21"], ["قواعد النحو", "النعت الحقيقي والسببي، والمطابقة، وصور النعت (مفرد، جملة، شبه جملة)", "تحويل الحقيقي إلى سببي والعكس مع تعليل المطابقة، وإعراب ثلاث صور"]]}, "enrich": [["بطاقات التحدي", "بطاقة أسبوعية لكل فائق بسؤالٍ من المستويات العليا (تحليل، تقييم، إبداع) على درس الأسبوع، تُناقش في دقيقتين آخر الحصة."], ["سفراء الضاد", "يقود الفائق مجموعة أقران في نشاط «تعلُّم الأقران» من الخطة العلاجية، ويُوثَّق دوره في ملف إنجازه."], ["صنّاع المحتوى", "ينتج الفائقون مقاطع قصيرة (دقيقة إلى دقيقتين) يشرحون فيها قاعدة أو صورة بلاغية لزملائهم، وتُعرض في قناة القسم أو الإذاعة المدرسية."], ["المسابقات والأنشطة", "ترشيحهم لمسابقات الوزارة والمنطقة في الإلقاء والخطابة والقصة والشعر، ولنادي اللغة العربية والإذاعة ومجلة الحائط."], ["القراءة الحرة", "كتابٌ شهري مختار بحسب المرحلة، يكتب عنه المتعلم بطاقة قراءة (فكرة، اقتباس، رأي) تُعرض في ركن القسم."], ["التحفيز والتقدير", "لوحة شرف للفائقين في ممرّ القسم، وشهادات تقدير تُسلَّم في الطابور أو لقاء أولياء الأمور."]], "enrich_stage": {"10": ["تأمّلٌ بلاغي في قصة موسى عليه السلام: استخراج صورتين من آيات القصص وبيان أثرهما بالرجوع إلى «التحرير والتنوير»", "ورشة «اصنع تشبيهك»: كتابة تشبيهات مبتكرة من بيئة الطالب بأقسام التشبيه كلها", "مشروع «معجمي الخاص»: بناء معجم مصوّر لمفردات الموضوعات المقررة"], "11": ["تحليل حديثين نبويين آخرين في القيم نفسها (الشكر والجحود) تحليلًا بلاغيًّا: الخبر والإنشاء وأغراضهما", "مناظرة صفّية: «النعمة اختبار» بين فريقين من الفائقين", "كتابة قصة قصيرة على بناء حديث النفر الثلاثة بشخصيات معاصرة"], "12": ["بحث مصغّر: «الإعجاز البياني في آيات الروم» بالرجوع إلى «التحرير والتنوير»", "كتابة مقال رأي وفق بناء المقال المقرر، ونشر أجوده في مجلة المدرسة", "إعداد مقاطع شرح لدرس النعت وصوره، يُستعان بها في الخطة العلاجية للصف"]}, "recs": [["توحيد المعايير بين الشعب", "اعتماد نموذج إجابة وتوزيع درجات موحَّد لكل صف، وتصحيح متبادل لعيّنة (<bdi dir=ltr>10%</bdi> من الأوراق) بين معلمي الصف الواحد قبل الرصد؛ لأن تباين النتائج بين بعض الشعب أكبر مما تفسّره الفروق بين المتعلمين وحدها."], ["رصد الدرجة بحسب المجال", "رصد درجة كل متعلم في المجالات الأربعة لا المجموع وحده، ليُبنى العلاج على مهارة بعينها، ويُحسب معامل الصعوبة والتمييز لكل سؤال (أرفق القسم نموذج رصد جاهزًا)."], ["أولوية الصف العاشر", "توجيه ورش التناولات في الأسابيع القادمة لمعلمي العاشر نحو مهارات الضعف، ونقل ممارسات الشعب الأعلى أداءً إلى بقية الشعب."], ["اختبار تعويضي للغائبين", "تطبيق الاختبار على المت function ruler(v,size='mid',color){
  const col=color||css('--b'+bandOf(v));
  let h='';

let charts=[];
function chart(id,opt,h){

  if(h)el.style.height=h+'px';

  const ink=css('--ink'),ink2=css('--ink2'),line=css('--line');

    tooltip:{confine:true,textStyle:{fontFamily:'IBM Plex Sans Arabic'},backgroundColor:css('--raise'),borderColor:line,extraCssText:'direction:rtl;text-align:right'}},opt));
  charts.push(c); return c;

const AX=(o={})=>Object.assign({axisLine:{lineStyle:{color:css('--line')}},axisTick:{show:false},axisLabel:{color:css('--ink2'),fontFamily:'IBM Plex Sans Arabic'},splitLine:{lineStyle:{color:css('--line'),opacity:.6}}},o);
function histChart(id,hist,h=220){
  const xs=[];for(let v=0;v<=15;v+=.5)xs.push(v);
  const first=Math.max(0,xs.findIndex(v=>(hist[v.toFixed(1)]||0)>0)-1);
  const use=xs.slice(first);
  chart(id,{grid:{left:6,right:6,top:20,bottom:4,containLabel:true},
    xAxis:AX({type:'category',inverse:true,data:use.map(fg),axisLabel:{color:css('--muted'),interval:use.length>20?3:1,fontSize:11}}),
    yAxis:AX({type:'value',minInterval:1,splitNumber:3,position:'right'}),
    tooltip:{trigger:'item',formatter:p=>`الدرجة ${p.name}: <b>${p.value}</b>`},
    series:[{type:'bar',barCategoryGap:'14%',data:use.map(v=>({value:hist[v.toFixed(1)]||0,itemStyle:{color:css('--b'+bandOf(v)),borderRadius:[3,3,0,0]}})),
      label:{show:use.length<=24,position:'top',fontSize:10,color:css('--ink2'),formatter:p=>p.value||''}}]},h);
}
function hbar(id,rows,opts={}){ // rows: [{label,value,color,id}]
  const h=Math.max(160,rows.length*34+40);
  const c=chart(id,{grid:{left:36,right:8,top:opts.top||8,bottom:8,containLabel:true},
    xAxis:AX({type:'value',inverse:true,max:opts.max,splitNumber:3,minInterval:opts.int?1:undefined}),
    yAxis:AX({type:'category',inverse:true,position:'right',data:rows.map(r=>R(r.label)),axisLabel:{color:css('--ink'),fontWeight:700,fontFamily:'Noto Kufi Arabic',fontSize:12}}),
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
    legend:opts.legend?{top:0,left:'center',itemGap:12,itemWidth:12,itemHeight:10,textStyle:{color:css('--ink2'),fontFamily:'IBM Plex Sans Arabic'}}:undefined,
    series:opts.series||[{type:'bar',barWidth:'58%',data:rows.map(r=>({value:r.value,itemStyle:{color:r.color,borderRadius:[4,0,0,4]}})),
      label:{show:true,position:'left',color:css('--ink'),fontWeight:700,formatter:p=>opts.fmt?opts.fmt(p.value):p.value},
      markLine:opts.mark!=null?{symbol:'none',silent:true,lineStyle:{color:css('--ink'),type:'dashed'},label:{show:false},data:[{xAxis:opts.mark}]}:undefined}]},h);
  if(c&&opts.click)c.on('click',p=>{const r=rows[p.dataIndex];if(r&&r.id)location.hash=opts.click(r)});
  return c;
}

function stageInsights(k){
  const s=ST[k],out=[];
  const hi=CL[s.gap.hi],lo=CL[s.gap.lo];
  out.push(`أعلى الشعب متوسطًا ${R(hi.label)} بمتوسط ${N(f2(hi.mean))}، وأدناها ${R(lo.label)} بمتوسط ${N(f2(lo.mean))}.`);
  if(s.kruskal.p<0.05) out.push(`الفروق بين الشعب دالّة إحصائيًّا وحجمها ${s.kruskal.eps2>=0.14?'كبير':s.kruskal.eps2>=0.06?'متوسط':'صغير'}؛ أي إن الشعبة تفسّر جزءًا حقيقيًّا من تفاوت الدرجات.`);
  else out.push(`الفروق بين الشعب غير دالّة إحصائيًّا، فالمستوى متقارب بين الشعب، والقوة أو الضعف سمةٌ للصف كله.`);
  out.push(`الضعاف ${N(s.weak_n)} (${pct(s.weak_pct)})، منهم ${N(s.crit_n)} دون نصف الدرجة؛ والحاصلون على الدرجة الكاملة ${N(s.full_n)}.`);
  if(s.track_test){const tt=s.track_test,tr=s.tracks; out.push(tt.p<0.05?`متوسط العلمي ${N(f2(tr['علمي'].mean))} مقابل الأدبي ${N(f2(tr['أدبي'].mean))}، والفرق دالّ.`:`لا فرق دالًّا بين العلمي (${N(f2(tr['علمي'].mean))}) والأدبي (${N(f2(tr['أدبي'].mean))}).`);}
  const ceil=s.classes.filter(c=>CL[c].ceiling_pct>=60);
  if(ceil.length) out.push(`في ${ceil.map(c=>R(CL[c].label)).join(' و')} نال أكثر من ${N('60%')} من الطلاب 14½ فأعلى، فالاختبار بلغ سقفه عندهم ولم يميّز بين مستوياتهم العليا.`);
  return out;
}

  <div class="card"><div class="score-head"><div class="big" style="color:var(--gold)">${N(SC.full_n)}<small>طالبًا</small></div><div class="cap">${pct(SC.full_pct)} من المختبَرين<br>نالوا الدرجة الكاملة</div></div>
  ${ruler(15,'mid',css('--gold'))}
  <div class="stats" style="grid-template-columns:1fr 1fr;margin-top:12px"><div class="stat g"><b>${N(SC.excel_n-SC.full_n)}</b><span>متفوقون: 13½ إلى 14½</span></div><div class="stat"><b>${N(ST['10'].full_n)}</b><span>فائقون في العاشر</span></div></div>
  <p class="note">الاختبار خمس عشرة جزئية لكل منها درجة، فالدرجة الكاملة تعني إتقان كل ما قيس بلا خطأ. ولأن بعض الشعب بلغت سقف الاختبار، يُستكمل الترشيح للبرامج الإثرائية بتقدير المعلم.</p></div>
  <div class="card"><h3>الفائقون في كل شعبة</h3><div id="ch_g" class="chart"></div></div>
  <a class="tile wide gold" href="#/enrich"><span class="ic">${ic('rocket')}</span><div><h3>الخطة الإثرائية</h3><p>برامج الفائقين وأنشطتهم بحسب الصف</p></div></a>`,
  after:()=>{fillRulers();hbar('ch_g',ids.map(id=>({label:CL[id].label,value:CL[id].full_n,color:css('--gold'),id})),{int:true,click:r=>'#/class/'+r.id});}};
};
pages.remedial=(k)=>{
  k=ST[k]?k:'10';
  const dose=[['الفهم والاستيعاب',5,'--bA'],['النحو',3,'--s12'],['البلاغة',2,'--s11'],['الثروة اللغوية',2,'--gold']];
  return {title:'الخطة العلاجية',back:'#/weak',html:`
  <div class="card"><h3>الفكرة</h3><p style="font-size:14.5px;color:var(--ink2)">علاج المهارة لا إعادة شرح الدرس. ولأن الدرجات رُصدت مجموعًا، يُعدّ ضعف كل طالب موزّعًا على المجالات الأربعة بأوزانها في الاختبار، فتُقسم الوقفات العلاجية الاثنتا عشرة هكذا:</p>
  <div class="dosage">${dose.map(([n,c,v])=>Array(c).fill(`<i style="background:${css(v)}"></i>`).join('')).join('')}</div>
  <div class="legend">${dose.map(([n,c,v])=>`<span><i style="background:${css(v)}"></i>${n} ${N(c)}</span>`).join('')}</div></div>
  <h2 class="sec-title">الخطوات</h2>
  <div class="card"><ol class="steps">${T.remedial.slice(1).map(([a,b,c])=>`<li><span class="when">${c}</span><b>${a}</b><p>${b}</p></li>`).join('')}</ol></div>
  <h2 class="sec-title">المهارات بحسب الصف</h2>
  <nav class="seg">${Object.keys(ST).map(x=>`<a href="#/remedial/${x}" class="${x===k?'on':''}">${stageName[x]}</a>`).join('')}</nav>
  ${T.remedial_stage[k].map(([a,b,c],i)=>`<details class="acc" ${i===0?'open':''}><summary>${a}</summary><div class="body"><p><b>المهارة:</b> ${b}</p><p style="margin-top:6px"><b>النشاط:</b> ${c}</p></div></details>`).join('')}
  <div class="card" style="margin-top:12px"><h3>مؤشرات النجاح</h3><ul class="insight"><li>انخفاض عدد الحرِجين إلى النصف على الأقل في الاختبار التتبعي.</li><li>ارتفاع متوسط طلاب الخطة درجتين فأكثر.</li><li>انتقال نصف «دون المستوى» إلى 10 فأعلى.</li></ul></div>`};
};
pages.enrich=(k)=>{
  k=ST[k]?k:'10';
  return {title:'الخطة الإثرائية',back:'#/gifted',html:`
  ${T.enrich.map(([a,b],i)=>`<details class="acc" ${i<2?'open':''}><summary>${a}</summary><div class="body">${b}</div></details>`).join('')}
  <h2 class="sec-title">أنشطة بحسب الصف</h2>
  <nav class="seg">${Object.keys(ST).map(x=>`<a href="#/enrich/${x}" class="${x===k?'on':''}">${stageName[x]}</a>`).join('')}</nav>
  <div class="card"><ul class="insight">${T.enrich_stage[k].map(x=>`<li>${x}</li>`).join('')}</ul></div>`};
};
pages.compare=(a,b)=>{
  const ids=Object.keys(CL); a=CL[a]?a:'10-1'; b=CL[b]?b:'12ع3'; if(!CL[b])b=ids[ids.length-1];
  const A=CL[a],B=CL[b];
  const opt=sel=>ids.map(id=>`<option value="${id}" ${id===sel?'selected':''}>${CL[id].label}</option>`).join('');
  const row=(k,va,vb,fmt,hiGood=true)=>{const wa=hiGood?va>vb:va<vb, wb=hiGood?vb>va:vb<va;return `<div class="cmp-row"><span class="a ${wa?'win':''}">${fmt(va)}</span><span class="k">${k}</span><span class="b ${wb?'win':''}">${fmt(vb)}</span></div>`};
  return {title:'قارن بين شعبتين',back:'#/',html:`
  <div class="vs"><select class="select" id="ca">${opt(a)}</select><select class="select" id="cb">${opt(b)}</select></div>
  <div class="card" style="margin-top:12px">
   <div class="vs" style="align-items:end"><div><b style="font-family:'Noto Kufi Arabic';font-size:20px">${A.label}</b>${ruler(A.mean,'sm',css('--s10'))}</div><div><b style="font-family:'Noto Kufi Arabic';font-size:20px">${B.label}</b>${ruler(B.mean,'sm',css('--s11'))}</div></div>
   <div style="margin-top:10px">
   ${row('المتوسط',A.mean,B.mean,v=>N(f2(v)))}${row('الوسيط',A.median,B.median,v=>N(fg(v)))}${row('الانحراف (التفاوت)',A.sd,B.sd,v=>N(f2(v)),false)}
   ${row('بلغوا النصف',A.pass_pct,B.pass_pct,pct)}${row('10 فأكثر',A.good_pct,B.good_pct,pct)}${row('الضعاف',A.weak_pct,B.weak_pct,v=>pct(v),false)}${row('الدرجة الكاملة',A.full_pct,B.full_pct,pct)}
   </div><p class="note">الأفضل في كل سطر ملوّن. النسب من عدد المختبَرين في كل شعبة.</p></div>
  <div class="card"><h3>التوزيعان معًا</h3><p class="sub">نسبة طلاب كل شعبة عند كل درجة</p><div id="ch_c" class="chart"></div></div>`,
  after:()=>{fillRulers();
    const go=()=>location.hash=`#/compare/${$('#ca').value}/${$('#cb').value}`;
    $('#ca').onchange=go;$('#cb').onchange=go;
    const xs=[];for(let v=0;v<=15;v+=.5)xs.push(v);
    const first=Math.max(0,xs.findIndex(v=>(A.hist[v.toFixed(1)]||0)+(B.hist[v.toFixed(1)]||0)>0)-1);const use=xs.slice(first);
    chart('ch_c',{grid:{left:6,right:6,top:30,bottom:4,containLabel:true},legend:{top:0,textStyle:{color:css('--ink2'),fontFamily:'IBM Plex Sans Arabic'}},
      tooltip:{trigger:'axis'},xAxis:AX({type:'category',inverse:true,data:use.map(fg),axisLabel:{interval:3,color:css('--muted')}}),yAxis:AX({type:'value',position:'right',axisLabel:{formatter:'{value}%',color:css('--muted')}}),
      series:[[A,'--s10'],[B,'--s11']].map(([X,c])=>({name:R(X.label),type:'bar',barGap:'10%',itemStyle:{color:css(c),borderRadius:[3,3,0,0]},data:use.map(v=>Math.round((X.hist[v.toFixed(1)]||0)/X.n*1000)/10)}))});
  }};
};
pages.diag=()=>{
  const g=D.diag, d=CL['12ع3'];
  if(!g) return pages.home();
  const sk=Object.entries(g.skills).sort((a,b)=>a[1]-b[1]);
  return {title:'12ع3: التشخيص والقصير',back:'#/',html:`
  <div class="card"><p style="font-size:14.5px;color:var(--ink2)">في 21 سبتمبر طُبّق على هذه الشعبة مسح تشخيصي في النحو والصرف (13 مهارة)، فكان متوسط الإتقان ${N('17%')}، وبُنيت لها خطة وقفات علاجية من الأسبوع الثالث. هنا درجة كل طالب في الاختبار القصير بجانب نتيجته في المسح.</p>
  <div class="stats" style="margin-top:12px"><div class="stat"><b>${N(f2(d.mean))}</b><span>متوسط القصير</span></div><div class="stat"><b>${N(d.rank_in_stage)} من ${N(ST['12'].classes.length)}</b><span>ترتيبها في الصف</span></div><div class="stat g"><b>${N(g.low_ok)} من ${N(g.low)}</b><span>من أضعف المسح بلغوا 10</span></div></div></div>
  <div class="card"><h3>المسح والقصير</h3><p class="sub">كل نقطة طالب. الخط المتقطع: درجة 10.</p><div id="ch_d" class="chart" style="height:280px"></div>
  <p class="note">الارتباط بينهما ضعيف وغير دالّ (ρ = ${N(g.rho)})، أي إن ضعف الطالب في مهارات المسح لم يمنعه من النجاح في مهارات القصير. ومهارات المسح غير مهارات القصير، فأثر الوقفات يُقاس بإعادة المسح نفسه في الأسبوع الثاني عشر.</p></div>
  <div class="card"><h3>إتقان مهارات النحو في المسح</h3><div id="ch_s" class="chart"></div></div>`,
  after:()=>{
    chart('ch_d',{grid:{left:6,right:10,top:14,bottom:26,containLabel:true},
      xAxis:AX({type:'value',min:0,max:7,interval:1,name:'مهارات المسح المتقنة (من 13)',nameLocation:'middle',nameGap:24,nameTextStyle:{color:css('--muted')}}),
      yAxis:AX({type:'value',min:0,max:15,interval:3}),tooltip:{formatter:p=>`المسح ${Math.round(p.value[0])} من 13، القصير ${fg(p.value[1])}`},
      series:[{type:'scatter',symbolSize:13,itemStyle:{color:css('--s12'),borderColor:css('--surface'),borderWidth:2},
        data:g.points.map(([a,b],i)=>[a+((i%3)-1)*0.09,b]),markLine:{symbol:'none',silent:true,lineStyle:{color:css('--bD'),type:'dashed'},label:{show:false},data:[{yAxis:10}]}}]});
    hbar('ch_s',sk.map(([n,v])=>({label:n,value:v,color:v===0?css('--bE'):css('--teal')})),{max:100,fmt:v=>v+'%'});
  }};
};
pages.recs=()=>({title:'التوصيات',back:'#/',html:`
  <div class="card">${T.recs.map(([a,b],i)=>`<div class="rec"><span class="n">${N(i+1)}</span><div><b>${a}</b><p>${b}</p></div></div>`).join('')}</div>
  <h2 class="sec-title">الجدول الزمني</h2>
  <div class="card"><ol class="steps">
   <li><span class="when">الأسبوع التاسع: 8 إلى 12 نوفمبر</span><b>البدء</b><p>توزيع الوقفات على المجالات، والتواصل مع أسر الحرِجين، وإطلاق «سفراء الضاد» وبطاقات التحدي.</p></li>
   <li><span class="when">الأسبوعان العاشر والحادي عشر: 15 إلى 26 نوفمبر</span><b>التنفيذ</b><p>الوقفات العلاجية وأوراق العمل المتدرجة، ومتابعة رئيس القسم في الزيارات.</p></li>
   <li><span class="when">الأسبوع الثاني عشر: 29 نوفمبر إلى 3 ديسمبر</span><b>إعادة القياس</b><p>اختبار تتبّعي، وتقرير مقارنة للإدارة، وتكريم الفائقين.</p></li></ol></div>`});
pages.about=()=>({title:'عن التحليل',back:'#/more',html:`
  <div class="card"><h3>مواصفات الاختبار</h3><table class="t"><tr><th>المجال</th><th>مقالي</th><th>موضوعي</th><th>الدرجة</th></tr>
  ${T.spec.map(([a,b,c,d])=>`<tr><td>${a}</td><td>${N(b)}</td><td>${N(c)}</td><td><b>${N(d)}</b></td></tr>`).join('')}<tr><td><b>المجموع</b></td><td>${N(9)}</td><td>${N(6)}</td><td><b>${N(15)}</b></td></tr></table>
  <p class="note">المصدر: دليل التقييم، توصيف الاختبار القصير للمرحلة الثانوية.</p></div>
  <div class="card"><h3>مستويات الأداء</h3><table class="t"><tr><th>المستوى</th><th>الدرجة</th></tr>
  ${D.bands.map(b=>`<tr><td><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${css('--b'+b.key)};margin-inline-end:7px;vertical-align:-1px"></span>${b.name}</td><td>${N(fg(b.lo)+' – '+fg(b.hi))}</td></tr>`).join('')}</table></div>
  <details class="acc" open><summary>من هم الضعاف؟</summary><div class="body">من نالوا أقل من 10 من 15، أي دون ثلثي الدرجة، وهو الحد الذي يبدأ عنده مستوى «جيد». ويُقسمون إلى حرِجين (دون 7½) ودون المستوى (7½ إلى 9½).</div></details>
  <details class="acc"><summary>من هم الفائقون؟</summary><div class="body">أصحاب الدرجة الكاملة 15، لأنها وحدها تعني إتقان الجزئيات الخمس عشرة كلها. ومن نال 13½ إلى 14½ متفوق.</div></details>
  <details class="acc"><summary>كيف عولجت البيانات؟</summary><div class="body">فُرّغت الدرجات من كشوف المعلمين وطوبقت الأسماء على قائمة طلاب المدرسة، وروجعت الكشوف المكتوبة باليد مرتين. الغائب لا يُعدّ صفرًا ولا يدخل الإحصاء، والمنتقل بين الشعب يُحسب في الشعبة التي اختُبر فيها. والفروق بين الشعب اختُبرت باختبارات لا معلمية (كروسكال–واليس ومان–ويتني). وأعدّ كل معلم اختبار شعبه، فالمقارنة بين الشعب تجمع أثر مستوى الطلاب وأثر صعوبة الاختبار معًا.</div></details>
  <details class="acc"><summary>الخصوصية</summary><div class="body">لا يعرض الموقع اسم أي طالب. الأسماء في النسخة المطبوعة من التقرير المرفوعة إلى الإدارة.</div></details>`});
pages.more=()=>({title:'المزيد',tab:'more',html:`
  <div class="more-list">
  ${[['school','#/school','صورة المدرسة','التوزيع، والمراحل، والشعب كلها'],['heal','#/remedial','الخطة العلاجية','الخطوات والمهارات بحسب الصف'],['rocket','#/enrich','الخطة الإثرائية','برامج الفائقين'],['compare','#/compare','قارن بين شعبتين','أي شعبتين جنبًا إلى جنب'],
    ...(D.diag?[['link','#/diag','12ع3: التشخيص والقصير','المسح التشخيصي بجانب الاختبار']]:[]),['list','#/recs','التوصيات','ما يقترحه القسم والجدول الزمني'],['info','#/about','عن التحليل','المواصفات والتصنيف والمعالجة']]
    .map(([i,h,t,d])=>`<a href="${h}"><span class="ic">${ic(i)}</span><span>${t}<span class="d">${d}</span></span><span class="chev">‹</span></a>`).join('')}
  </div>
  <div class="card theme-row"><b>المظهر</b><nav class="seg" style="margin:0;min-width:200px"><button data-t="light">فاتح</button><button data-t="auto">تلقائي</button><button data-t="dark">داكن</button></nav></div>`,
  after:()=>{const cur=getTheme();V.querySelectorAll('[data-t]').forEach(b=>{b.classList.toggle('on',b.dataset.t===cur);b.onclick=()=>{setTheme(b.dataset.t);route();}});}});

// ---------- المظهر ----------
function getTheme(){try{return localStorage.getItem('qt-theme')||'auto'}catch(e){return 'auto'}}
function setTheme(t){try{localStorage.setItem('qt-theme',t)}catch(e){} applyTheme(t)}
function applyTheme(t){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  document.querySelector('meta[name=theme-color]').content=css('--paper');}
applyTheme(getTheme());
$('#themebtn').onclick=()=>{const dark=matchMedia('(prefers-color-scheme: dark)').matches;const cur=getTheme();const isDark=cur==='dark'||(cur==='auto'&&dark);setTheme(isDark?'light':'dark');route();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(getTheme()==='auto'){applyTheme('auto');route();}});

// ---------- الموجّه ----------
let lastKey='';
function route(){
  const parts=(location.hash.replace(/^#\/?/,'')||'home').split('/').map(decodeURIComponent);
  const name=parts[0]||'home';
  const fn=pages[name]||pages.home;
  charts.forEach(c=>c.dispose());charts=[];
  const p=fn(...parts.slice(1));
  $('#title').textContent=p.title;
  document.title=p.title==='نتائج الاختبار القصير'?p.title:p.title+' — نتائج الاختبار القصير';
  V.innerHTML=p.html;
  const key=location.hash;
  if(key!==lastKey){V.classList.remove('enter');void V.offsetWidth;V.classList.add('enter');window.scrollTo(0,0);}
  lastKey=key;
  const back=$('#back');back.hidden=name==='home'||!!(p.tab&&!p.back);back.onclick=()=>{location.hash=p.back||'#/'};
  const tab=p.tab||(name==='home'?'home':'');
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.k===tab));
  if(name==='stage'||name==='class'){const k=name==='stage'?(parts[1]||'10'):(CL[parts[1]]||{}).stage;document.querySelector('#tabs a[data-k=stage]').href='#/stage/'+(k||'10');}
  if(p.after)p.after();
}
addEventListener('hashchange',route);
addEventListener('resize',()=>charts.forEach(c=>c.resize()));
addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',scrollY>4),{passive:true});
route();
window.__ready=true;
})();
</script>
